<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="2020~2026 정보처리기사 실기 기출 21회차를 기준으로 이론·계산·코딩·SQL을 출제 회차와 함께 정리한 노트">
<meta name="theme-color" content="#1e2a5a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f65660'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3E%EC%8B%A4%3C/text%3E%3C/svg%3E">
<title>정처기 실기 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Jua&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 기술 블로그형 레이아웃(인파 블로그 실측 기준): 왼쪽 카테고리 사이드바 + 가운데 770px 본문 + 넓은 화면에서만 오른쪽 목차.
   본문 16.8px / 행간 1.8 / 글자 #3c4148. 제목은 둥근 굵은 글꼴 + 빨강·연분홍 두 겹 밑줄. 코드 블록은 macOS 창 + One Dark. */
:root{
  --bg:#ffffff; --bg-2:#f6f7f9; --band:#f1f2f5; --line:#e6e8ec; --line-2:#d5d9df;
  --ink:#262d40; --text:#3c4148; --muted:#7a8288; --faint:#a3a9ae;
  --accent:#f65660; --accent-ink:#e0303c; --accent-soft:#fdecee; --accent-line:#f9c9cd;
  --info:#00b8d4; --info-soft:#e8f8fb; --warn:#ff9100; --warn-soft:#fff4e5; --ok:#00a37a;
  --hero:#1e2a5a; --hero-2:#2f3f86;
  --code-bg:#282c34; --code-head:#21252b; --code-fg:#abb2bf; --inline-bg:#f4f5f7; --inline-line:#e3e5e8;
  --body:"Nanum Gothic",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --display:"Jua","Nanum Gothic",-apple-system,"Apple SD Gothic Neo",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --side:260px; --col:770px; --bar:60px; --tab:58px;
  color-scheme:light;
}
/* 인파 블로그처럼 흰 바탕이 기본. 다크는 보기 설정에서 직접 고른 경우에만. */
:root[data-theme="dark"]{
  --bg:#16191f; --bg-2:#1c2028; --band:#111418; --line:#2a2f38; --line-2:#3a404b;
  --ink:#eef0f4; --text:#c9ced6; --muted:#8d949d; --faint:#6b727b;
  --accent:#ff6b74; --accent-ink:#ff7b83; --accent-soft:#3a1f24; --accent-line:#5a2a31;
  --info:#29c7e0; --info-soft:#14303a; --warn:#ffa233; --warn-soft:#3a2a14; --ok:#2fc59a;
  --hero:#18224a; --hero-2:#25336e;
  --code-bg:#1f2329; --code-head:#181b20; --code-fg:#abb2bf; --inline-bg:#232831; --inline-line:#323844;
  color-scheme:dark;}

*{box-sizing:border-box}
body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
code,pre,kbd{font-family:var(--mono);font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 읽기 진행 바: CSS 스크롤 타임라인(지원 브라우저만) */
.progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:70;background:linear-gradient(90deg,var(--ok),var(--info));transform-origin:0 50%;transform:scaleX(0);pointer-events:none}
@supports (animation-timeline:scroll()){.progress{animation:grow linear both;animation-timeline:scroll(root)}}
@keyframes grow{to{transform:scaleX(1)}}

/* 상단 바 */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;height:var(--bar);display:flex;align-items:center;gap:6px;padding:0 18px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-size:20px;color:var(--ink);display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand b{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;font-weight:400;font-size:15px}
.iconbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--bg-2);color:var(--ink)}
.spacer{flex:1}
#menuBtn{display:none}

/* 골격 */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr)}
.side{position:sticky;top:calc(var(--bar) + env(safe-area-inset-top,0px));height:calc(100vh - var(--bar) - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);padding:22px 14px 40px;background:var(--bg)}
.main{min-width:0;overflow-x:clip}
.toc{position:fixed;top:calc(var(--bar) + 40px);right:24px;width:220px;max-height:calc(100vh - var(--bar) - 80px);overflow-y:auto;font-size:13px;display:none}
@media (min-width:1660px){.toc{display:block}}
@media (max-width:960px){
  #menuBtn{display:grid}
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:min(84vw,300px);z-index:60;transform:translateX(-104%);transition:transform .25s cubic-bezier(.16,1,.3,1);padding-top:calc(20px + env(safe-area-inset-top,0px));box-shadow:0 10px 40px rgba(20,25,40,.18)}
  .side.open{transform:none}
}
.scrim{position:fixed;inset:0;background:rgba(15,18,28,.45);z-index:55}
@media (min-width:961px){.scrim{display:none!important}}

/* 사이드바: 카테고리 목록 */
.side .who{display:flex;align-items:center;gap:12px;padding:4px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:16px}
.side .who .av{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--hero),var(--hero-2));color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:16px}
.side .who b{display:block;color:var(--ink);font-size:15px}
.side .who span{font-size:12.5px;color:var(--muted)}
.cat-label{font-size:12.5px;color:var(--faint);padding:14px 10px 6px;letter-spacing:.02em}
.cat{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;color:var(--text);font-size:14.5px}
.cat:hover{background:var(--bg-2)}
.cat .ic{width:30px;height:30px;border-radius:50%;background:var(--bg-2);display:grid;place-items:center;font-size:11.5px;font-weight:800;color:var(--muted);flex:none;font-family:var(--mono)}
.cat .nm{flex:1;min-width:0}
.cat .ct{font-size:11px;color:var(--accent);border:1px solid var(--accent-line);border-radius:999px;padding:0 7px;line-height:17px;font-variant-numeric:tabular-nums}
.cat.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.cat.active .ic{background:var(--accent);color:#fff}
.cat.home .ic{font-family:var(--body)}

/* 히어로 띠 */
.hero{position:relative;background:linear-gradient(135deg,var(--hero),var(--hero-2));color:#fff;padding:54px 24px 72px;text-align:center;overflow:hidden}
.hero::after{content:"";position:absolute;left:-5%;right:-5%;bottom:-1px;height:44px;background:var(--bg);border-radius:50% 50% 0 0/100% 100% 0 0}
.hero .tag{display:inline-block;background:var(--accent);color:#fff;font-size:13px;font-weight:700;padding:5px 14px;border-radius:999px;margin-bottom:16px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,4.4vw,40px);line-height:1.3;letter-spacing:-.01em}
.hero .meta{margin-top:14px;font-size:14px;color:rgba(255,255,255,.8);display:flex;gap:8px 16px;justify-content:center;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.hero .meta b{color:#fff}

/* 본문 기둥 */
.post{max-width:calc(var(--col) + 48px);margin:0 auto;padding:8px 24px 120px}
@media (max-width:960px){.post{padding:4px 18px calc(var(--tab) + 60px + env(safe-area-inset-bottom,0px))}}
.lead{font-size:16.8px;line-height:1.8;color:var(--text);margin:8px 0 34px}
.lead p{margin:0 0 14px}

/* 목차 상자 (빨간 머리줄 + 번호 행) */
.tocbox{border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:0 0 44px}
.tocbox .hd{display:flex;align-items:center;gap:8px;background:var(--accent);color:#fff;font-weight:700;padding:11px 16px;font-size:15px}
.tocbox .hd .n{margin-left:auto;font-weight:400;font-size:13px;opacity:.9}
.tocbox a{display:flex;gap:12px;align-items:baseline;padding:11px 16px;border-top:1px solid var(--line);font-size:15px;color:var(--text);background:color-mix(in srgb,var(--accent-soft) 35%,var(--bg))}
.tocbox a:nth-child(odd){background:var(--bg)}
.tocbox a:hover{color:var(--accent-ink)}
.tocbox a .no{color:var(--accent);font-variant-numeric:tabular-nums;min-width:22px;font-family:var(--mono);font-size:13px}
.tocbox a .t{flex:1;min-width:0}
.tocbox a .c{font-size:12px;color:var(--muted);white-space:nowrap}
.tocbox a.d .t{color:var(--faint);text-decoration:line-through}
.tocbox .more{display:block;width:100%;padding:10px 16px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted);background:var(--bg)}

/* 묶음(섹션) */
.set{padding:10px 0 34px;scroll-margin-top:calc(var(--bar) + 14px)}
.set + .set{position:relative;padding-top:64px}
.set + .set::before{content:"";position:absolute;top:22px;left:-200vw;right:-200vw;height:12px;background:var(--band)}
.set-h{position:relative;padding-bottom:8px;margin-bottom:16px;display:flex;align-items:flex-start;gap:12px}
.set-h::before{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent-line);opacity:.7}
.set-h::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:min(270px,40%);background:var(--accent)}
.set-h h2{flex:1;min-width:0;font-family:var(--display);font-weight:400;font-size:clamp(23px,3.2vw,29px);line-height:1.5;color:var(--ink)}
.set-h .no{font-family:var(--mono);font-size:13px;color:var(--accent);padding-top:12px}
.chk{margin-top:8px;width:30px;height:30px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;color:transparent;flex:none;transition:background .15s,border-color .15s}
.chk svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chk:hover{border-color:var(--accent)}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.set.done .set-h h2{color:var(--faint)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 6px}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--bg-2);color:var(--muted);font-family:var(--mono);border:1px solid var(--line)}
.chip.hot{background:var(--accent);color:#fff;border-color:var(--accent);font-family:var(--body);font-weight:700}
.chip.none{font-family:var(--body)}
.kv{font-size:15px;color:var(--muted);margin:10px 0 0;line-height:1.7}
.kv b{display:inline-block;color:var(--accent-ink);font-weight:800;margin-right:8px}
.kv code{background:var(--inline-bg);border:1px solid var(--inline-line);border-radius:4px;padding:1px 6px;font-size:.86em;color:var(--ink)}
.kv strong{color:var(--ink)}

/* 본문 타이포 */
.prose{font-size:16.8px;line-height:1.8;color:var(--text)}
.prose p{margin:0 0 18px}
.prose h3{font-family:var(--body);font-weight:800;font-size:20px;color:var(--ink);margin:34px 0 14px;line-height:1.5}
.prose h4{font-weight:800;font-size:17px;color:var(--ink);margin:30px 0 12px;padding:2px 0 2px 12px;border-left:4px solid var(--accent);line-height:1.45}
.prose h3 + h4{margin-top:16px}
.prose ul,.prose ol{padding-left:24px;margin:0 0 18px}
.prose li{margin:6px 0}
.prose li::marker{color:var(--accent)}
.prose strong{color:var(--ink);font-weight:800}
.prose a{color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px}
.prose :not(pre) > code{background:var(--inline-bg);border:1px solid var(--inline-line);border-radius:4px;padding:1px 6px;font-size:.84em;color:var(--ink)}
.prose blockquote{margin:0 0 18px;padding:12px 18px;border-left:4px solid var(--accent);background:var(--bg-2);border-radius:0 6px 6px 0}
.prose blockquote p:last-child{margin:0}
.prose hr{border:0;border-top:1px solid var(--line);margin:28px 0}
.tbl{overflow-x:auto;margin:0 0 22px;border-radius:6px;border:1px solid var(--line)}
.prose table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.65;min-width:420px}
.prose th{background:var(--bg-2);color:var(--ink);font-weight:800;text-align:left;padding:10px 14px;border-bottom:2px solid var(--line-2);white-space:nowrap}
.prose td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.prose tr:last-child td{border-bottom:0}
.prose td:first-child{color:var(--ink)}

/* 코드 블록: macOS 창 */
.code{margin:0 0 6px;border-radius:7px;overflow:hidden;background:var(--code-bg);box-shadow:0 8px 24px -12px rgba(15,20,35,.35)}
.code .bar{display:flex;align-items:center;gap:7px;padding:11px 14px;background:var(--code-head);border-bottom:1px solid rgba(255,255,255,.06)}
.code .bar i{width:12px;height:12px;border-radius:50%;display:block}
.code .bar i:nth-child(1){background:#ff5f57}.code .bar i:nth-child(2){background:#febc2e}.code .bar i:nth-child(3){background:#28c840}
.code .bar span{margin-left:auto;color:#ff6b74;font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.code .bar button{color:#8b929c;font-size:12px;margin-left:12px;padding:2px 8px;border-radius:5px;border:1px solid rgba(255,255,255,.12)}
.code .bar button:hover{color:#fff}
.code .bar .wr{display:none}
.code.wrap pre{white-space:pre-wrap;overflow-wrap:anywhere}
.code.wrap .bar .wr{color:#fff;border-color:rgba(255,255,255,.4)}
@media (max-width:640px){.code .bar .wr{display:inline-block}.code .bar button{margin-left:8px}}
.code pre{margin:0;padding:18px 20px;overflow-x:auto;color:var(--code-fg);font-size:14.5px;line-height:1.65;tab-size:4}
.code pre code{background:none;border:0;padding:0;font-size:inherit;color:inherit}
.out{margin:0 0 22px;border-radius:7px;border:1px solid var(--line);overflow:hidden}
.code + p,.code + ul,.code + h4{margin-top:18px}
.out-tbl{overflow-x:auto}.out-tbl table{margin:0;border:0;border-radius:0}
.out .lb{display:flex;align-items:center;gap:8px;padding:7px 14px;font-size:12.5px;color:var(--ok);font-weight:800;background:var(--bg-2);border-bottom:1px solid var(--line)}
.out pre{margin:0;padding:12px 16px;font-size:14.5px;line-height:1.6;color:var(--ink);background:var(--bg);overflow-x:auto;white-space:pre}
.out pre code{background:none;border:0;padding:0;font-size:inherit}
.prose .out + p{color:var(--muted)}
.prose > .code:last-child,.prose > .adm .code:last-child{margin-bottom:22px}

/* 안내 상자 (Info / 기출 / 주의) */
.adm{margin:6px 0 24px;border-left:5px solid var(--info);background:color-mix(in srgb,var(--info-soft) 40%,var(--bg));border-radius:4px;box-shadow:0 2px 10px -4px rgba(15,20,35,.15)}
.adm .ah{display:flex;align-items:center;gap:9px;padding:10px 16px;background:var(--info-soft);color:var(--info);font-weight:800;font-size:15.5px}
.adm .ab{padding:14px 18px 6px;font-size:16px;line-height:1.8}
.adm .ab > :last-child{margin-bottom:12px}
.adm.exam{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 30%,var(--bg))}
.adm.exam .ah{background:var(--accent-soft);color:var(--accent-ink)}
.adm.exam strong{color:var(--accent-ink)}
.adm.exam li::marker{color:var(--accent)}
.adm.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn-soft) 40%,var(--bg))}
.adm.warn .ah{background:var(--warn-soft);color:var(--warn)}
.adm.warn li::marker{color:var(--warn)}
.adm.how{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 4%,var(--bg))}
.adm.how .ah{background:color-mix(in srgb,var(--ok) 12%,var(--bg));color:var(--ok)}
.adm.how li::marker,.adm.how ol li::marker{color:var(--ok);font-weight:800}

/* 홈 */
.home-intro{font-size:16.8px;line-height:1.8;margin:6px 0 30px}
.sec-t{font-family:var(--display);font-weight:400;font-size:24px;color:var(--ink);margin:40px 0 18px;position:relative;padding-bottom:8px}
.sec-t::before{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent-line);opacity:.7}
.sec-t::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:120px;background:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:620px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 30px -18px rgba(15,20,35,.35)}
.card .th{height:96px;display:flex;align-items:flex-end;justify-content:space-between;padding:14px 16px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2))}
.card .th b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1}
.card .th span{font-size:12px;background:rgba(0,0,0,.18);padding:3px 9px;border-radius:999px}
.card .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card .d{font-size:14.5px;color:var(--text);line-height:1.6}
.card .f{margin-top:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .f .bar{flex:1;height:4px;border-radius:2px;background:var(--bg-2);overflow:hidden}
.card .f .bar i{display:block;height:100%;background:var(--ok)}
.hot-list{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.hot-list a{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 16px;border-top:1px solid var(--line)}
.hot-list a:first-child{border-top:0}
.hot-list a:hover{background:var(--bg-2)}
.hot-list .r{font-family:var(--display);font-size:20px;color:var(--accent)}
.hot-list .t{font-weight:700;color:var(--ink);font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hot-list .t small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.hot-list .c{font-size:12.5px;font-weight:700;color:#fff;background:var(--accent);padding:3px 10px;border-radius:999px;white-space:nowrap}

/* 오른쪽 목차 */
.toc h5{margin:0 0 10px;font-size:13px;color:var(--ink);font-weight:800}
.toc a{display:block;padding:5px 12px;border-left:2px solid var(--line);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc a:hover{color:var(--ink)}
.toc a.on{border-color:var(--accent);color:var(--accent-ink);font-weight:700}

/* 이전/다음 */
.pager{display:flex;justify-content:space-between;gap:20px;margin-top:44px;padding-top:14px;border-top:1px solid var(--line)}
.pager a{display:flex;flex-direction:column;gap:2px;min-width:0;max-width:48%;padding:4px 0}
.pager .k{font-size:12.5px;color:var(--muted)}

.pager a:hover .t{color:var(--accent)}
.pager .nx{margin-left:auto;text-align:right;align-items:flex-end}

/* 하단 탭 (폰) */
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--tab) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--faint);height:var(--tab)}
.tabbar a.on{color:var(--accent-ink);font-weight:700}
@media (max-width:960px){.tabbar{display:flex}}

/* 검색 */
.search{position:fixed;inset:0;z-index:80;background:rgba(15,18,28,.5);display:flex;align-items:flex-start;justify-content:center;padding:calc(9vh + env(safe-area-inset-top,0px)) 14px 14px}
.search .box{width:min(660px,100%);max-height:78vh;display:flex;flex-direction:column;background:var(--bg);border-radius:14px;overflow:hidden;box-shadow:0 30px 70px -20px rgba(10,14,25,.5)}
.search .in{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);color:var(--muted)}
.search input{flex:1;font:inherit;font-size:17px;padding:16px 0;border:0;background:none;color:var(--ink);outline:0;min-width:0}
.search input::placeholder{color:var(--faint)}
.search .res{overflow-y:auto;padding:8px}
.search .res a{display:block;padding:11px 12px;border-radius:10px}
.search .res a:hover,.search .res a.sel{background:var(--bg-2)}
.search .res .p{font-size:12px;color:var(--accent-ink);font-weight:700}
.search .res .t{font-weight:800;color:var(--ink);font-size:15px;margin-top:1px}
.search .res .s{font-size:13.5px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.search .res mark{background:var(--accent-soft);color:var(--accent-ink);border-radius:3px;padding:0 2px}
.search .empty{padding:28px;text-align:center;color:var(--faint);font-size:14.5px}

.skel{padding:30px 0}.skel i{display:block;height:16px;border-radius:5px;background:var(--bg-2);margin:12px 0}
.skel i:nth-child(1){width:40%;height:26px}.skel i:nth-child(3){width:80%}
.err{margin:30px 0;padding:18px;border-left:5px solid var(--warn);background:var(--warn-soft);border-radius:4px}

/* 코드 하이라이트: One Dark */
.hljs-keyword,.hljs-selector-tag,.hljs-literal{color:#c678dd}
.hljs-built_in,.hljs-type,.hljs-class .hljs-title{color:#e5c07b}
.hljs-string,.hljs-attr,.hljs-regexp{color:#98c379}
.hljs-number{color:#d19a66}
.hljs-comment{color:#7f848e;font-style:italic}
.hljs-title,.hljs-function .hljs-title,.hljs-title.function_{color:#61afef}
.hljs-meta,.hljs-meta .hljs-keyword{color:#56b6c2}
.hljs-params,.hljs-variable{color:#e06c75}

.prose code.nw,.kv code{white-space:nowrap}

  /* 홈 카드 */

}

.tocbox .hd .tg{display:none;margin-left:10px;font-weight:400;font-size:12.5px;opacity:.9}

@media (max-width:640px){

/* 마크다운 전처리: 묶음 머리의 "출제/형태/함정" 줄을 메타로, 코드 밖의 ~ 는 취소선이 되지 않게 */
function preprocess(md){
  let fence=false;
  return md.split('\n').map(line=>{
    if(/^\s*```/.test(line)){fence=!fence;return line}
    if(fence) return line;
    const m=line.match(/^(출제|형태|함정)\s*[:：]\s*(.*)$/);
    if(m) return `\n<p class="meta-line" data-k="${m[1]}">${esc(m[2])}</p>\n`;
    return line.split('`').map((s,i)=>i%2?s:s.replace(/~/g,'&#126;').replace(/\*\*([^*\n]+?)\*\*/g,'<strong>$1</strong>')).join('`');
  }).join('\n');
}

/* 소제목별 상자 종류 */
function boxKind(t){

  if(/^자주 틀리는/.test(t)) return ['warn','자주 틀리는 포인트'];
  if(/^풀이 절차/.test(t)) return ['how','풀이 절차'];
  if(/^공통 규칙/.test(t)) return ['how','공통 규칙'];
  return null;
}

function enhanceBody(body){
  // 표 감싸기
  body.querySelectorAll('table').forEach(t=>{

    if(cap) fig.insertAdjacentHTML('beforeend',`<figcaption>${esc(cap)}</figcaption>`);

      const box=document.createElement('div');box.className='out';
      box.innerHTML='<div class="lb"><svg class="i" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="m5 8 4 4-4 4M11 16h8"/></svg>실행 결과</div>';
      prev.replaceWith(box);box.appendChild(pre);return;
    }
    const code=pre.querySelector('code');const lang=((code&&code.className.match(/language-(\w+)/))||[])[1]||'';
    const w=document.createElement('div');w.className='code';
    w.innerHTML=`<div class="bar"><i></i><i></i><i></i><span>${esc(lang||'code')}</span><button type="button" class="wr">줄바꿈</button><button type="button" class="cp">복사</button></div>`;
    pre.before(w);w.appendChild(pre);

  [...body.querySelectorAll('p')].forEach(p=>{
    if(!/^출력\s*[:：]\s*$/.test(p.textContent.trim())) return;
    const nx=p.nextElementSibling; if(!nx) return;
    const t=nx.matches('table')?nx:(nx.querySelector&&nx.querySelector(':scope > table')&&nx.children.length===1?nx:null); if(!t) return;
    const box=document.createElement('div');box.className='out out-tbl';
    box.innerHTML='<div class="lb"><svg class="i" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="m5 8 4 4-4 4M11 16h8"/></svg>실행 결과</div>';
    p.replaceWith(box);box.appendChild(t);

  [...body.querySelectorAll('p')].forEach(p=>{

    const ab=box.querySelector('.ab');let n=h.nextSibling;
    while(n && !(n.nodeType===1 && /^H[23]$/.test(n.tagName))){const nx=n.nextSibling;ab.appendChild(n);n=nx}

/* 간트 차트: 각 줄 "P1 0-1" */
const GC=['#f65660','#3b82f6','#10b981','#f59e0b','#8b5cf6','#06b6d4','#ec4899'];
function renderGantt(src){
  const segs=src.split('\n').map(l=>l.trim().match(/^(\S+)\s+(\d+)\s*-\s*(\d+)/)).filter(Boolean).map(m=>({p:m[1],s:+m[2],e:+m[3]}));
  if(!segs.length) return '';
  const T=Math.max(...segs.map(x=>x.e)),ps=[...new Set(segs.map(x=>x.p))].sort();
  const col=p=>GC[ps.indexOf(p)%GC.length];
  const ticks=[...new Set(segs.flatMap(x=>[x.s,x.e]))].sort((a,b)=>a-b);
  return `<div class="gantt" role="img" aria-label="간트 차트"><div class="gbar">${segs.map(x=>`<span style="flex:${x.e-x.s};--c:${col(x.p)}" title="${x.p} ${x.s}~${x.e}">${x.e-x.s>=2?x.p:''}</span>`).join('')}</div>
  <div class="gticks">${ticks.map(t=>`<i style="left:${t/T*100}%">${t}</i>`).join('')}</div>
  <div class="glegend">${ps.map(p=>`<span><b style="background:${col(p)}"></b>${p}</span>`).join('')}</div></div>`;
}
/* 단계 그림: 각 줄 "제목 | 설명" (화면 폭에 맞춰 줄바꿈) */
function renderSteps(src){
  const it=src.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(x=>x[0]);
  return `<ol class="steps">${it.map((x,i)=>`<li${i===0?' class="st0"':''}><b>${esc(x[0])}</b>${x[1]?`<span>${esc(x[1])}</span>`:''}</li>`).join('')}</ol>`;
}
/* V 모델: 각 줄 "개발 단계 | 테스트 단계" (위에서 아래로) */
function renderVModel(src){
  const it=src.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(x=>x.length>=2);
  const n=it.length;
  return `<div class="vm" style="--n:${n}"><div class="vm-h"><span>개발 (위에서 아래로)</span><span>테스트 (아래에서 위로)</span></div>${it.map((x,i)=>`<div class="vm-r" style="--i:${i}"><span class="vm-l">${esc(x[0])}</span><i class="vm-k${i===n-1?' last':''}"></i><span class="vm-t">${esc(x[1])}</span></div>`).join('')}</div>`;
}
/* 인덱스 그림: 첫 줄의 문자열 글자마다 앞 번호(0부터)와 뒤 번호(-1부터)를 붙인다 */
function renderIdx(src){
  const t=[...src.split('\n')[0].trim()],n=t.length;
  const cols=t.map((ch,i)=>`<span class="col"><i class="p">${i}</i><b>${esc(ch)}</b><i class="m">${i-n}</i></span>`).join('');
  return `<div class="idx"><div class="row">${cols}</div><div class="key"><span><span class="p">윗줄</span> 앞에서 센 번호</span><span><span class="m">아랫줄</span> 뒤에서 센 번호</span></div></div>`;
}
/* 비트 그림: "223.13.234.132/26" */
function renderBits(src){
  return src.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const m=l.match(/^([\d.]+)\s*\/\s*(\d+)(.*)$/); if(!m) return '';
    const oct=m[1].split('.').map(Number),n=+m[2],note=m[3].trim();
    const mask=[0,1,2,3].map(i=>{const b=Math.max(0,Math.min(8,n-i*8));return (0xff<<(8-b))&0xff});
    const net=oct.map((o,i)=>o&mask[i]);
    const row=(vals,label)=>`<div class="brow"><span class="bl">${label}</span>${vals.map((v,i)=>`<span class="oct"><span class="cells">${[...v.toString(2).padStart(8,'0')].map((b,j)=>`<i class="${i*8+j<n?'n':'h'}">${b}</i>`).join('')}</span><em>${v}</em></span>`).join('')}</div>`;
    return `<div class="bits">${row(oct,'IP')}${row(mask,'마스크')}${row(net,'네트워크')}
      <div class="bkey"><span><b class="n"></b>네트워크 ${n}비트</span><span><b class="h"></b>호스트 ${32-n}비트</span>${note?`<span class="bn">${esc(note)}</span>`:''}</div></div>`;
  }).join('');
}
/* 코드 줄마다 감싸기: 줄바꿈 모드에서 이어지는 줄을 들여쓰기 아래로 맞춘다 */
function lineify(code){
  const html=code.innerHTML,re=/(<span[^>]*>)|(<\/span>)|(\n)|([^<\n]+|<[^>]*>)/g;let m,stack=[],line='';const lines=[];
  while((m=re.exec(html))){if(m[1]){stack.push(m[1]);line+=m[1]}else if(m[2]){stack.pop();line+=m[2]}else if(m[3]){line+='</span>'.repeat(stack.length);lines.push(line);line=stack.join('')}else line+=m[4]}
  lines.push(line+'</span>'.repeat(stack.length));
  while(lines.length&&!lines[lines.length-1].replace(/<[^>]+>/g,'').trim())lines.pop();
  code.innerHTML=lines.map(l=>{const ind=(l.replace(/<[^>]+>/g,'').match(/^ */)[0].length);return `<span class="ln" style="--i:${ind}">${l||' '}</span>`}).join('');
}
let mmdLoad=null;
function loadMermaid(){
  if(window.mermaid) return Promise.resolve();
  if(mmdLoad) return mmdLoad;
  return mmdLoad=new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)}).then(()=>{
    mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'"Nanum Gothic",sans-serif',
      flowchart:{htmlLabels:true,curve:'basis',padding:16,nodeSpacing:34,rankSpacing:44,diagramPadding:10},
      state:{padding:10},
      themeVariables:{fontSize:'15px',primaryColor:'#fff4f5',primaryBorderColor:'#f3a3a9',primaryTextColor:'#262d40',secondaryColor:'#e9f8fb',secondaryBorderColor:'#8fdbe8',tertiaryColor:'#f7f8fa',tertiaryBorderColor:'#e3e6ea',lineColor:'#9ba3ab',textColor:'#3c4148',titleColor:'#e0303c',clusterBkg:'#f7f8fa',clusterBorder:'#e6e8ec',edgeLabelBackground:'#ffffff',noteBkgColor:'#fff4e5',noteBorderColor:'#ffb45c',mainBkg:'#fff4f5',nodeBorder:'#f3a3a9',classText:'#262d40'}});
  });
}
async function drawFigures(root){
  const nodes=[...root.querySelectorAll('.mmd:not([data-processed])')]; if(!nodes.length) return;
  // "%% 폰: TB" 처럼 적힌 그림은 폰에서 방향을 바꿔 그린다 (앞은 전체 방향, "/" 뒤는 묶음 안쪽 방향)
  if(matchMedia('(max-width:640px)').matches) nodes.forEach(n=>{
    const m=n.textContent.match(/%%\s*폰\s*:\s*(TB|LR|BT|RL)(?:\s*\/\s*(TB|LR|BT|RL))?/); if(!m) return;
    let src=n.textContent;
    if(/^\s*(%%.*\n\s*)*(flowchart|graph)\s/.test(src)){
      src=src.replace(/^(\s*(?:flowchart|graph)\s+)(TB|TD|LR|BT|RL)/m,'$1'+m[1]);
      if(m[2]) src=src.replace(/^(\s+)direction\s+(TB|LR|BT|RL)/gm,'$1direction '+m[2]);
    } else src=src.replace(/^(\s*)direction\s+(TB|LR|BT|RL)/m,'$1direction '+m[1]);
    n.textContent=src;
  });
  try{await loadMermaid();await mermaid.run({nodes})}catch(e){nodes.forEach(n=>{if(!n.querySelector('svg'))n.closest('.fig').classList.add('fig-err')})}
}
function parsePage(id,md){
  const root=document.createElement('div');root.innerHTML=marked.parse(preprocess(md));
  const intro=document.createElement('div'),out=document.createElement('div'),sets=[];let cur=null,n=0,title='';
  [...root.childNodes].forEach(node=>{
    if(node.nodeType===1&&node.tagName==='H1'){title=node.textContent.trim();return}
    if(node.nodeType===1&&node.tagName==='H2'){
      n++;const anchor=`${id}-s${n}`,set={id:anchor,title:node.textContent.trim(),rounds:[],num:n};sets.push(set);
      cur=document.createElement('section');cur.className='set';cur.id=anchor;cur.dataset.set=anchor;
      cur.innerHTML=`<div class="set-h"><span class="no">${pad(n)}</span><h2>${esc(set.title)}</h2><button class="chk" type="button" aria-label="다 봤음 표시" data-set="${anchor}"><svg viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg></button></div><div class="meta"></div><div class="kvs"></div><div class="prose"></div>`;
      cur._set=set;out.appendChild(cur);return;
    }
    if(node.nodeType===1&&node.classList&&node.classList.contains('meta-line')&&cur){
      const k=node.dataset.k,v=node.textContent.trim();
      if(k==='출제'){
        const r=v.split(/[,\s·]+/).filter(x=>/^\d\d-\d$/.test(x));cur._set.rounds=r;const meta=cur.querySelector('.meta');
        meta.innerHTML=r.length?`<span class="chip hot">기출 ${r.length}회</span>`+r.map(x=>`<span class="chip">${x}</span>`).join(''):'<span class="chip none">2020~2026 기출 없음</span>';
      } else cur.querySelector('.kvs').insertAdjacentHTML('beforeend',`<p class="kv"><b>${k}</b>${fmt(v)}</p>`);
      return;
    }
    (cur?cur.querySelector('.prose'):intro).appendChild(node);
  });
  out.querySelectorAll('.prose').forEach(enhanceBody);
  sets.forEach((s,i)=>{const c=out.children[i].cloneNode(true);c.querySelectorAll('.fig').forEach(f=>f.remove());s.text=c.textContent.replace(/\s+/g,' ').trim()});
  return {title,introHTML:intro.innerHTML,bodyEl:out,sets};
}
async function load(id){
  if(cache[id]) return cache[id];
  const r=await fetch(`content/${id}.md`,{cache:'no-cache'});
  if(!r.ok) throw new Error(`${byId[id].title} 내용을 불러오지 못했습니다(${r.status}). 새로고침해 보세요.`);
  return cache[id]=parsePage(id,await r.text());
}

/* 렌더 */
const side=document.getElementById('side'),main=document.getElementById('main'),toc=document.getElementById('toc');
function renderSide(active,cur){
  const groups=[...new Set(PAGES.map(p=>p.group))];
  side.innerHTML=`<div class="who"><div class="av">실기</div><div><b>정처기 실기 노트</b><span>2020~2026 기출 21회차 기준</span></div></div>
  <a class="cat home ${active==='home'?'active':''}" href="#home"><span class="ic">홈</span><span class="nm">처음으로</span></a>`+
  groups.map(g=>`<div class="cat-label">··· ${g}</div>`+PAGES.filter(p=>p.group===g).map(p=>{const c=cache[p.id];const t=c?c.sets.length:'';const d=c?c.sets.filter(s=>done[s.id]).length:0;
    const sub=(active===p.id&&c)?`<div class="units-side">${c.sets.map(s=>`<a href="#${s.id}" class="${s.id===cur?'on':''} ${done[s.id]?'dn':''}"><span>${esc(s.title)}</span>${s.rounds.length?`<em>${s.rounds.length}</em>`:''}</a>`).join('')}</div>`:'';
    return `<a class="cat ${active===p.id?'active':''}" href="#${p.id}"><span class="ic">${p.ab}</span><span class="nm">${p.title}</span>${c?`<span class="ct">${d?d+'/':''}${t}</span>`:''}</a>${sub}`}).join('')).join('');
  document.querySelectorAll('.tabbar a[data-tab]').forEach(a=>a.classList.toggle('on',a.dataset.tab===active));
  const on=side.querySelector('.units-side a.on'); if(on) on.scrollIntoView({block:'nearest'});
}
function hero(tag,title,meta){return `<div class="hero"><span class="tag">${esc(tag)}</span><h1>${esc(title)}</h1><div class="meta">${meta}</div></div>`}
function skel(){main.innerHTML='<div class="post"><div class="skel"><i></i><i></i><i></i></div></div>'}

/* 영역 페이지 = 묶음 목차 */
async function showArea(id){
  renderSide(id);toc.innerHTML='';skel();
  let pg;try{pg=await load(id)}catch(e){main.innerHTML=`<div class="post"><div class="err">${esc(e.message)}</div></div>`;return}
  renderSide(id);
  const p=byId[id];const tested=pg.sets.filter(s=>s.rounds.length).length;const d=pg.sets.filter(s=>done[s.id]).length;
  main.innerHTML=hero(`${p.group}`,pg.title||p.title,`<span>묶음 <b>${pg.sets.length}</b></span><span>기출에 나온 묶음 <b>${tested}</b></span><span>봤음 <b>${d}</b>/${pg.sets.length}</span>`)+
  `<div class="post"><div class="lead">${pg.introHTML}</div><div class="units">${pg.sets.map(s=>{const sec=pg.bodyEl.children[s.num-1];const kv=sec.querySelector('.kv');
    return `<a class="unit ${done[s.id]?'dn':''}" href="#${s.id}"><span class="no">${pad(s.num)}</span><span class="bd"><b>${esc(s.title)}</b>${kv?`<small>${esc(kv.textContent.replace(/^(형태|함정)/,'$1 · '))}</small>`:''}</span><span class="rt">${s.rounds.length?`<em>기출 ${s.rounds.length}회</em>`:'<i>기출 없음</i>'}${done[s.id]?'<u>봤음</u>':''}</span></a>`}).join('')}</div>${areaPager(id)}</div>`;
  window.scrollTo(0,0);
}
function areaPager(id){const i=PAGES.findIndex(p=>p.id===id),a=PAGES[i-1],b=PAGES[i+1];return `<div class="pager">${a?`<a href="#${a.id}"><span class="k">‹ 이전 영역</span><span class="t">${a.title}</span></a>`:''}${b?`<a class="nx" href="#${b.id}"><span class="k">다음 영역 ›</span><span class="t">${b.title}</span></a>`:''}</div>`}

/* 묶음 페이지 = 소단위 하나 */
async function showSet(id,n){
  renderSide(id,`${id}-s${n}`);toc.innerHTML='';skel();
  let pg;try{pg=await load(id)}catch(e){main.innerHTML=`<div class="post"><div class="err">${esc(e.message)}</div></div>`;return}
  const s=pg.sets[n-1]; if(!s) return showArea(id);
  renderSide(id,s.id);
  const p=byId[id];
  const prev=pg.sets[n-2]||null,next=pg.sets[n]||null;
  const pi=PAGES.findIndex(x=>x.id===id),nextArea=PAGES[pi+1],prevArea=PAGES[pi-1];
  main.innerHTML=`<div class="hero slim"><span class="tag">${p.title} · ${n}/${pg.sets.length}</span><h1>${esc(s.title)}</h1></div><div class="post"><div id="body"></div>
  <div class="pager">${prev?`<a href="#${prev.id}"><span class="k">‹ 이전</span><span class="t">${esc(prev.title)}</span></a>`:prevArea?`<a href="#${prevArea.id}"><span class="k">‹ 이전 영역</span><span class="t">${prevArea.title}</span></a>`:''}${next?`<a class="nx" href="#${next.id}"><span class="k">다음 ›</span><span class="t">${esc(next.title)}</span></a>`:nextArea?`<a class="nx" href="#${nextArea.id}"><span class="k">다음 영역 ›</span><span class="t">${nextArea.title}</span></a>`:''}</div>
  <a class="back" href="#${id}">${p.title} 목차로</a></div>`;
  const body=main.querySelector('#body');const sec=pg.bodyEl.children[n-1].cloneNode(true);sec.classList.add('single');sec.querySelector('.set-h h2').remove();sec.querySelector('.set-h .no').remove();sec.querySelector('.chk').insertAdjacentHTML('beforeend','<span>다 봤음</span>');body.appendChild(sec);
  const phone=matchMedia('(max-width:640px)').matches;
  body.querySelectorAll('.code').forEach(c=>{const el=c.querySelector('pre code');try{hljs.highlightElement(el)}catch(e){}lineify(el);if(phone){c.classList.add('wrap');c.querySelector('.wr').textContent='가로 보기'}});
  if(phone) body.querySelectorAll('.tbl.keep').forEach(w=>{if(w.scrollWidth>w.clientWidth+2){if(w.querySelectorAll('thead th').length<=6){w.classList.remove('keep');w.classList.add('stack')}else w.insertAdjacentHTML('beforebegin','<p class="swipe">표가 넓어요. 옆으로 밀어서 보세요 →</p>')}});
  drawFigures(body);
  applyDone(sec);
  body.addEventListener('click',e=>{
    const b=e.target.closest('.chk');
    if(b){const k=b.dataset.set;if(done[k])delete done[k];else done[k]=true;store.set('jcg-done',done);applyDone(sec);renderSide(id,s.id);return}
    const wr=e.target.closest('.wr');if(wr){const c=wr.closest('.code');c.classList.toggle('wrap');wr.textContent=c.classList.contains('wrap')?'가로 보기':'줄바꿈';return}
    const cp=e.target.closest('.cp');
    if(cp){const txt=cp.closest('.code').querySelector('pre').innerText;const ok=()=>{cp.textContent='복사됨';setTimeout(()=>cp.textContent='복사',1200)};
      try{navigator.clipboard.writeText(txt).then(ok,()=>{selectText(cp)})}catch(err){selectText(cp)}}
  });
  toc.innerHTML=`<h5>${p.title}</h5>`+pg.sets.map(x=>`<a href="#${x.id}" class="${x.id===s.id?'on':''}">${esc(x.title)}</a>`).join('');
  window.scrollTo(0,0);
}
function selectText(btn){const pre=btn.closest('.code').querySelector('pre');const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent='선택됨';setTimeout(()=>btn.textContent='복사',1200)}
function applyDone(sec){const on=!!done[sec.dataset.set];sec.classList.toggle('done',on);sec.querySelector('.chk').classList.toggle('on',on)}

async function showHome(){
  renderSide('home');toc.innerHTML='';skel();
  const rs=await Promise.allSettled(PAGES.map(p=>load(p.id)));
  const all=[];PAGES.forEach((p,i)=>{if(rs[i].status==='fulfilled')rs[i].value.sets.forEach(s=>all.push({...s,page:p}))});
  const total=all.length,d=all.filter(s=>done[s.id]).length,tested=all.filter(s=>s.rounds.length).length;
  const top=all.filter(s=>s.page.group!=='풀이').sort((a,b)=>b.rounds.length-a.rounds.length).slice(0,10);
  renderSide('home');
  main.innerHTML=hero('정보처리기사 실기','정처기 실기 노트',`<span>묶음 <b>${total}</b></span><span>기출에 나온 묶음 <b>${tested}</b></span><span>봤음 <b>${d}</b> (${total?Math.round(d/total*100):0}%)</span>`)+
  `<div class="post">
    <div class="home-intro"><p>2020년 1회부터 2026년 2회까지 실기 기출 21회차, 420문제를 기준으로 정리한 노트입니다. 한 문제에 같이 나오는 개념끼리 묶었고, 묶음마다 실제로 나온 회차를 붙였습니다. 서브넷·스케줄링 같은 계산 문제는 풀이 순서대로 따로 모았습니다.</p></div>
    <h2 class="sec-t">카테고리</h2>
    <div class="cards">${PAGES.map((p,i)=>{const s=rs[i].status==='fulfilled'?rs[i].value.sets:[];const dd=s.filter(x=>done[x.id]).length;const tr=s.reduce((a,x)=>a+x.rounds.length,0);
      return `<a class="card" href="#${p.id}" style="--c1:${p.c[0]};--c2:${p.c[1]}"><div class="th"><b>${p.title}</b><span>${p.group}</span></div><div class="bd"><div class="d">${p.desc}</div><div class="f"><span>${s.length}개 묶음, 기출 ${tr}건</span><span class="bar"><i style="width:${s.length?Math.round(dd/s.length*100):0}%"></i></span><span>${dd}/${s.length}</span></div></div></a>`}).join('')}</div>
    <h2 class="sec-t">가장 자주 나온 개념</h2>
    <div class="hot-list">${top.map((s,i)=>`<a href="#${s.id}"><span class="r">${i+1}</span><span class="t">${esc(s.title)}<small>${s.page.title}</small></span><span class="c">${s.rounds.length}회</span></a>`).join('')}</div>
  </div>`;
  window.scrollTo(0,0);
}

/* 라우팅: #영역 = 목차, #영역-sN = 묶음 한 개 */
function route(){const h=(location.hash||'#home').slice(1);closeSide();if(!h||h==='home')return showHome();const m=h.match(/^([a-z-]+?)(?:-s(\d+))?$/);if(m&&byId[m[1]])return m[2]?showSet(m[1],+m[2]):showArea(m[1]);showHome()}
window.addEventListener('hashchange',route);

/* 서랍 / 검색 */
const scrim=document.getElementById('scrim');
function openSide(){side.classList.add('open');scrim.hidden=false}
function closeSide(){side.classList.remove('open');scrim.hidden=true}
document.getElementById('menuBtn').addEventListener('click',()=>side.classList.contains('open')?closeSide():openSide());
document.getElementById('tabMenu').addEventListener('click',e=>{e.preventDefault();side.classList.contains('open')?closeSide():openSide()});
scrim.addEventListener('click',closeSide);
side.addEventListener('click',e=>{if(e.target.closest('a'))closeSide()});
const search=document.getElementById('search'),q=document.getElementById('q'),res=document.getElementById('res');
function openSearch(){search.hidden=false;q.value='';res.innerHTML='<div class="empty">두 글자 이상 입력하세요</div>';setTimeout(()=>q.focus(),30);Promise.allSettled(PAGES.map(p=>load(p.id)))}
function closeSearch(){search.hidden=true}
document.getElementById('searchBtn').addEventListener('click',openSearch);
document.getElementById('tabSearch').addEventListener('click',e=>{e.preventDefault();openSearch()});
search.addEventListener('click',e=>{if(e.target===search)closeSearch()});
res.addEventListener('click',e=>{if(e.target.closest('a'))closeSearch()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeSearch();closeSide()}
  if(e.key==='/'&&search.hidden&&!/input|textarea/i.test(document.activeElement.tagName)){e.preventDefault();openSearch()}
  if(!search.hidden&&['ArrowDown','ArrowUp','Enter'].includes(e.key)){const it=[...res.querySelectorAll('a')];if(!it.length)return;let i=it.findIndex(a=>a.classList.contains('sel'));
    if(e.key==='Enter'){it[i>=0?i:0].click();return}e.preventDefault();i=e.key==='ArrowDown'?Math.min(i+1,it.length-1):Math.max(i-1,0);it.forEach((a,j)=>a.classList.toggle('sel',j===i));it[i].scrollIntoView({block:'nearest'})}
});
let qt;q.addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(doSearch,120)});
async function doSearch(){
  const term=q.value.trim();if(term.length<2){res.innerHTML='<div class="empty">두 글자 이상 입력하세요</div>';return}
  await Promise.allSettled(PAGES.map(p=>load(p.id)));
  const t=term.toLowerCase(),hits=[];
  PAGES.forEach(p=>{const c=cache[p.id];if(!c)return;c.sets.forEach(s=>{const ti=s.title.toLowerCase(),tx=(s.text||'').toLowerCase();let sc=0;if(ti.includes(t))sc+=10;if(s.rounds.includes(term))sc+=8;const ix=tx.indexOf(t);if(ix>=0)sc+=1+Math.min(3,(tx.split(t).length-1)/3);if(sc>0)hits.push({s,p,sc,ix})})});
  hits.sort((a,b)=>b.sc-a.sc);
  if(!hits.length){res.innerHTML=`<div class="empty">"${esc(term)}" 검색 결과가 없습니다</div>`;return}
  const re=new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig');
  res.innerHTML=hits.slice(0,30).map(({s,p,ix})=>{const sn=ix>=0?s.text.slice(Math.max(0,ix-50),ix+90):s.text.slice(0,120);
    return `<a href="#${s.id}"><div class="p">${p.title}${s.rounds.length?` · 기출 ${s.rounds.length}회`:''}</div><div class="t">${esc(s.title).replace(re,m=>`<mark>${m}</mark>`)}</div><div class="s">${esc(sn).replace(re,m=>`<mark>${m}</mark>`)}</div></a>`}).join('');
}
route();
</script>
